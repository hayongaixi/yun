name: macOS 桌面 + mefrp 穿透（完整版）
on:
  workflow_dispatch:

jobs:
  macos-with-frp:
    runs-on: macos-latest
    timeout-minutes: 360
    env:
      NEW_USER: macuser
      NEW_PASS: Mac@1234
      UNIQUE_ID: 1001
      GROUP_ID: 20
      USER_DIR: /Users/$NEW_USER
      FRP_BIN: mefrpc_arm64
      FRP_TOKEN: bab042f57c6e615bc8692773cf2386dc
      FRP_SERVER_PORT: 125545
      VNC_PORT: 5900

    steps:
      # 最关键的一步：克隆仓库代码到 runner（必须加！）
      - name: 克隆仓库代码（获取所有文件）
        uses: actions/checkout@v4  # 拉取当前仓库到 GITHUB_WORKSPACE 目录
        with:
          fetch-depth: 0  # 拉取完整仓库，避免浅克隆遗漏文件

      # 1. 验证仓库是否被正确克隆（调试用）
      - name: 确认仓库文件已拉取
        run: |
          echo "当前工作目录：$GITHUB_WORKSPACE"
          echo "查看仓库根目录文件："
          ls -la "$GITHUB_WORKSPACE"
          echo "查看 .github 目录："
          ls -la "$GITHUB_WORKSPACE/.github"
          echo "查看 .github/workflows 目录："
          ls -la "$GITHUB_WORKSPACE/.github/workflows"
          echo "查看 scripts 目录（若存在）："
          ls -la "$GITHUB_WORKSPACE/.github/workflows/scripts" 2>/dev/null

      # 2. 清理旧用户
      - name: 清理旧用户残留
        run: |
          if dscl . -read /Users/$NEW_USER &> /dev/null; then
            sudo dscl . -delete /Users/$NEW_USER
            sudo rm -rf $USER_DIR
          fi

      # 3. 创建新用户
      - name: 创建新用户
        run: |
          sudo dscl . -create /Users/$NEW_USER
          sudo dscl . -create /Users/$NEW_USER UserShell /bin/bash
          sudo dscl . -create /Users/$NEW_USER RealName "macOS User"
          sudo dscl . -create /Users/$NEW_USER UniqueID $UNIQUE_ID
          sudo dscl . -create /Users/$NEW_USER PrimaryGroupID $GROUP_ID
          sudo dscl . -create /Users/$NEW_USER NFSHomeDirectory $USER_DIR
          sudo dscl . -passwd /Users/$NEW_USER $NEW_PASS
          sudo mkdir -p $USER_DIR
          sudo chown -R $NEW_USER:staff $USER_DIR
          sudo dseditgroup -o edit -a $NEW_USER -t user admin
          echo "✅ 新用户创建成功"

      # 4. 启动桌面和VNC服务
      - name: 启动桌面和VNC服务
        run: |
          sudo launchctl start com.apple.WindowServer
          sudo -u $NEW_USER open -a loginwindow
          sleep 20
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist
          sudo dscl . -create /Users/$NEW_USER RemoteManagementEnabled true
          echo "✅ 桌面和VNC服务启动成功"

      # 5. 关闭防火墙
      - name: 关闭防火墙
        run: |
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off
          echo "✅ 防火墙已关闭"

      # 6. 启动 mefrp 穿透（现在仓库已克隆，文件能找到）
      - name: 启动 mefrp 穿透
        run: |
          FRP_PATH="$GITHUB_WORKSPACE/.github/workflows/scripts/$FRP_BIN"
          
          echo "===== 路径检查 ====="
          echo "FRP 文件路径：$FRP_PATH"
          if [ -f "$FRP_PATH" ]; then
            echo "✅ 找到 frp 客户端文件"
          else
            echo "❌ 仍未找到文件！scripts 目录内容："
            ls -la "$GITHUB_WORKSPACE/.github/workflows/scripts" 2>/dev/null
            exit 1
          fi
          
          chmod +x "$FRP_PATH"
          nohup "$FRP_PATH" -t "$FRP_TOKEN" -p "$FRP_SERVER_PORT" > ~/frp.log 2>&1 &
          sleep 5
          
          if pgrep "$FRP_BIN" >/dev/null; then
            echo "✅ mefrp 启动成功（PID: $(pgrep $FRP_BIN)）"
          else
            echo "❌ mefrp 启动失败，日志："
            cat ~/frp.log
            exit 1
          fi

      # 7. 保活
# 8. 温和保活（避免系统回收，稳定运行6小时）
      - name: 稳定保活桌面和 frp
        run: |
          FRP_PATH="$GITHUB_WORKSPACE/.github/workflows/scripts/$FRP_BIN"
          echo "===== 保活服务启动 ====="
          echo "FRP 路径：$FRP_PATH"
          echo "========================"
          
          # 单循环+温和保活：只“启动/维持”进程，不强制重启
          while true; do
            # 温和维持 WindowServer（存在则不操作，不存在才启动）
            if ! pgrep WindowServer >/dev/null; then
              echo "⚠️  桌面进程已退出，启动中..."
              sudo launchctl kickstart -s system/com.apple.WindowServer
            fi
            
            # 维持 frp 进程
            if ! pgrep "$FRP_BIN" >/dev/null; then
              echo "⚠️  frp 已退出，重启中..."
              nohup "$FRP_PATH" -t "$FRP_TOKEN" -p "$FRP_SERVER_PORT" > ~/frp.log 2>&1 &
            fi
            
            # 高频输出日志（每2分钟一次），让 GitHub 知道 job 还在运行
            echo "[$(date)] 服务稳定运行 → 穿透端口：$FRP_SERVER_PORT | 桌面进程：$(pgrep WindowServer >/dev/null && echo "运行中" || echo "未运行") | frp 进程：$(pgrep "$FRP_BIN" >/dev/null && echo "运行中" || echo "未运行")"
            sleep 120  # 2分钟输出一次，避免系统判定“无响应”
          done
