- name: 配置虚拟显示器（1280x800，温和生效）
  run: |
    # 1. 确保配置文件目录可写
    sudo chmod 644 /Library/Preferences/com.apple.windowserver.plist 2>/dev/null
    
    # 2. 写入分辨率配置（分步骤执行，避免批量操作触发系统保护）
    echo "设置分辨率开关..."
    sudo defaults write /Library/Preferences/com.apple.windowserver.plist DisplayResolutionEnabled -bool true
    sleep 2
    
    echo "设置宽度..."
    sudo defaults write /Library/Preferences/com.apple.windowserver.plist DisplayResolutionWidth -int 1280
    sleep 2
    
    echo "设置高度..."
    sudo defaults write /Library/Preferences/com.apple.windowserver.plist DisplayResolutionHeight -int 800
    sleep 2
    
    # 3. 验证配置是否写入成功（关键：确认配置生效基础）
    echo "验证配置..."
    if [ "$(sudo defaults read /Library/Preferences/com.apple.windowserver.plist DisplayResolutionWidth 2>/dev/null)" -eq 1280 ] && \
       [ "$(sudo defaults read /Library/Preferences/com.apple.windowserver.plist DisplayResolutionHeight 2>/dev/null)" -eq 800 ]; then
      echo "✅ 分辨率配置写入成功"
    else
      echo "❌ 配置写入失败，尝试手动设置..."
      # 备选方案：直接修改plist二进制文件（极端情况）
      sudo plutil -replace DisplayResolutionWidth -int 1280 /Library/Preferences/com.apple.windowserver.plist
      sudo plutil -replace DisplayResolutionHeight -int 800 /Library/Preferences/com.apple.windowserver.plist
    fi
    
    # 4. 温和重启WindowServer（先停止再启动，给系统释放资源时间）
    echo "重启窗口服务器..."
    if pgrep WindowServer >/dev/null; then
      sudo launchctl bootout system/com.apple.WindowServer  # 先停止
      sleep 5  # 等待资源释放
    fi
    sudo launchctl bootstrap system/com.apple.WindowServer  # 再启动
    sleep 15  # 延长等待，确保完全启动
    
    echo "✅ 虚拟显示器配置完成，分辨率 1280x800"
