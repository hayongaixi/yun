name: macOS 桌面 + mefrp 穿透（黑屏终极解决）
on:
  workflow_dispatch:

jobs:
  macos-black-screen-fix:
    runs-on: macos-latest
    timeout-minutes: 3600
    env:
      NEW_USER: macuser
      NEW_PASS: Mac@1234
      FRP_BIN: mefrpc_arm64
      FRP_TOKEN: bab042f57c6e615bc8692773cf2386dc
      FRP_SERVER_PORT: 125545
      VNC_PORT: 5900

    steps:
      # 1. 克隆仓库
      - name: 克隆仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 创建/复用用户
      - name: 创建/复用用户
        run: |
          if ! dscl . -read /Users/$NEW_USER &> /dev/null; then
            sudo dscl . -create /Users/$NEW_USER
            sudo dscl . -create /Users/$NEW_USER UserShell /bin/bash
            sudo dscl . -create /Users/$NEW_USER UniqueID 1001
            sudo dscl . -create /Users/$NEW_USER PrimaryGroupID 20
            sudo dscl . -create /Users/$NEW_USER NFSHomeDirectory /Users/$NEW_USER
            sudo dscl . -passwd /Users/$NEW_USER $NEW_PASS
            sudo mkdir -p /Users/$NEW_USER
            sudo chown -R $NEW_USER:staff /Users/$NEW_USER
            sudo dseditgroup -o edit -a $NEW_USER -t user admin
            echo "✅ 用户创建成功"
          else
            echo "ℹ️ 用户已存在，直接使用"
          fi

      # 3. 安装工具+设置分辨率（完整参数）
      - name: 安装工具+设置分辨率
        run: |
          brew install screenresolution
          screenresolution set 1024x768x32@60
          echo "✅ 分辨率设置成功"

      # 4. 核心修复：绑定用户会话+强制启用屏幕共享
      - name: 启动桌面（绑定用户+完整权限）
        run: |
          # 1. 强制启用屏幕共享（不光加载plist，还要开权限）
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on -users $NEW_USER -privs -all -restart -agent -menu
          
          # 2. 以新用户身份启动桌面组件（关键！绑定用户会话）
          sudo -u $NEW_USER launchctl bootstrap gui/1001 /System/Library/LaunchAgents/com.apple.Dock.plist
          sudo -u $NEW_USER launchctl bootstrap gui/1001 /System/Library/LaunchAgents/com.apple.Finder.plist
          sudo -u $NEW_USER launchctl bootstrap gui/1001 /System/Library/LaunchAgents/com.apple.loginwindow.plist
          
          # 3. 重启WindowServer并绑定用户
          sudo launchctl bootout system/com.apple.WindowServer 2>/dev/null
          sleep 3
          sudo -u $NEW_USER launchctl bootstrap gui/1001 /System/Library/LaunchDaemons/com.apple.WindowServer.plist
          
          # 4. 延长等待，确保组件加载
          sleep 30
          echo "✅ 桌面绑定用户会话成功，核心组件已启动"

      # 5. 关闭防火墙+验证VNC端口
      - name: 关闭防火墙+检查VNC
        run: |
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off
          # 验证VNC端口是否在监听
          lsof -i :$VNC_PORT || echo "⚠️ VNC端口未监听，重试启动" && sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist
          echo "✅ 防火墙关闭，VNC端口已启用"

      # 6. 启动frp
      - name: 启动mefrp穿透
        run: |
          FRP_PATH="$GITHUB_WORKSPACE/.github/workflows/scripts/$FRP_BIN"
          chmod +x "$FRP_PATH"
          nohup "$FRP_PATH" -t "$FRP_TOKEN" -p "$FRP_SERVER_PORT" > ~/frp.log 2>&1 &
          sleep 5
          pgrep "$FRP_BIN" && echo "✅ frp启动成功" || (cat ~/frp.log && exit 1)

      # 7. 保活（维持用户会话）
      - name: 保活服务（绑定用户）
        run: |
          FRP_PATH="$GITHUB_WORKSPACE/.github/workflows/scripts/$FRP_BIN"
          while true; do
            # 确保桌面组件以用户身份运行
            pgrep -u $NEW_USER WindowServer || sudo -u $NEW_USER launchctl bootstrap gui/1001 /System/Library/LaunchDaemons/com.apple.WindowServer.plist
            pgrep -u $NEW_USER Dock || sudo -u $NEW_USER launchctl bootstrap gui/1001 /System/Library/LaunchAgents/com.apple.Dock.plist
            pgrep "$FRP_BIN" || nohup "$FRP_PATH" -t "$FRP_TOKEN" -p "$FRP_SERVER_PORT" > ~/frp.log 2>&1 &
            echo "[$(date)] 正常运行 → 连接：你的frp服务器:$FRP_SERVER_PORT"
            sleep 120
          done
