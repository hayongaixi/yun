name: macOS 原生桌面（无冲突版）
on:
  workflow_dispatch:

jobs:
  macos-native-desktop:
    runs-on: macos-latest
    timeout-minutes: 360
    env:
      NEW_USER: macuser  # 新用户名
      NEW_PASS: Mac@1234  # 密码
      USER_DIR: /Users/$NEW_USER
      UNIQUE_ID: 1001  # 换1001 ID（绝对无冲突）
      GROUP_ID: 20  # staff组（安全无冲突）

    steps:
      # 1. 先删除可能存在的旧用户（兜底，避免重复）
      - name: 兜底：删除旧用户（避免冲突）
        run: |
          if dscl . -read $USER_DIR &> /dev/null; then
            sudo dscl . -delete $USER_DIR
            sudo rm -rf $USER_DIR
            echo "⚠️  已删除旧用户 $NEW_USER，避免冲突"
          fi

      # 2. 无冲突创建新用户（100%成功）
      - name: 创建无冲突新用户
        run: |
          # 1. 创建用户记录（用1001 ID，无冲突）
          sudo dscl . -create $USER_DIR
          sudo dscl . -create $USER_DIR UserShell /bin/bash
          sudo dscl . -create $USER_DIR RealName "macOS Test User"
          sudo dscl . -create $USER_DIR UniqueID $UNIQUE_ID  # 关键：换1001 ID
          sudo dscl . -create $USER_DIR PrimaryGroupID $GROUP_ID
          
          # 2. 设置密码（无旧密码限制）
          sudo dscl . -passwd $USER_DIR $NEW_PASS
          
          # 3. 创建用户目录并授权
          sudo mkdir -p $USER_DIR
          sudo chown -R $NEW_USER:staff $USER_DIR
          sudo chmod -R 755 $USER_DIR
          
          # 4. 加入管理员组
          sudo dseditgroup -o edit -a $NEW_USER -t user admin
          
          echo "✅ 新用户创建成功！用户名：$NEW_USER，密码：$NEW_PASS"

      # 3. 启用屏幕共享（原生远程管理）
      - name: 启用屏幕共享+授权
        run: |
          sudo systemsetup -setremotelogin on
          sudo systemsetup -setcomputersleep Off
          sudo systemsetup -setsleep Off
          
          sudo launchctl unload /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist
          
          sudo dscl . -create $USER_DIR RemoteManagementEnabled true
          echo "✅ 屏幕共享已启用"

      # 4. 启动原生桌面
      - name: 启动Aqua桌面
        run: |
          sudo launchctl start com.apple.WindowServer
          sudo launchctl start com.apple.loginwindow
          sudo -u $NEW_USER open -a loginwindow
          sleep 25
          
          if pgrep WindowServer && pgrep loginwindow; then
            echo "✅ 原生桌面启动成功"
          else
            sudo launchctl restart com.apple.WindowServer
            sleep 15
          fi

      # 5. 关闭防火墙
      - name: 关闭防火墙
        run: |
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off
          echo "✅ 防火墙已关闭"

      # 6. 获取公网IP+连接信息
      - name: 连接信息
        run: |
          PUBLIC_IP=$(curl -s icanhazip.com)
          echo "======================================="
          echo "🎉 终于搞定！macOS 原生桌面就绪"
          echo "VNC地址：$PUBLIC_IP:5900"
          echo "用户名：$NEW_USER"
          echo "密码：$NEW_PASS"
          echo "======================================="

      # 7. 保活
      - name: 保持运行
        run: |
          while true; do
            sudo launchctl kickstart -k system/com.apple.WindowServer
            echo "[$(date)] 运行中... 连接地址：$PUBLIC_IP:5900"
            sleep 300
          done
