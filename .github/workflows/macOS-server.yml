name: macOS 桌面 + mefrp 穿透（终极终极解决）
on:
  workflow_dispatch:

jobs:
  macos-final-ultimate:
    runs-on: macos-latest
    timeout-minutes: 3600
    env:
      NEW_USER: macuser
      NEW_PASS: Mac@1234
      FRP_BIN: mefrpc_arm64
      FRP_TOKEN: bab042f57c6e615bc8692773cf2386dc
      FRP_SERVER_PORT: 125545
      VNC_PORT: 5900

    steps:
      # 1. 克隆仓库
      - name: 克隆仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 创建/复用用户
      - name: 创建/复用用户
        run: |
          if ! dscl . -read /Users/$NEW_USER &> /dev/null; then
            sudo dscl . -create /Users/$NEW_USER
            sudo dscl . -create /Users/$NEW_USER UserShell /bin/bash
            sudo dscl . -create /Users/$NEW_USER UniqueID 1001
            sudo dscl . -create /Users/$NEW_USER PrimaryGroupID 20
            sudo dscl . -create /Users/$NEW_USER NFSHomeDirectory /Users/$NEW_USER
            sudo dscl . -passwd /Users/$NEW_USER $NEW_PASS
            sudo mkdir -p /Users/$NEW_USER
            sudo chown -R $NEW_USER:staff /Users/$NEW_USER
            sudo dseditgroup -o edit -a $NEW_USER -t user admin
            echo "✅ 用户创建成功"
          else
            echo "ℹ️ 用户已存在，直接使用"
          fi

      # 3. 安装工具+设置分辨率
      - name: 安装工具+设置分辨率
        run: |
          brew install screenresolution
          screenresolution set 1024x768x32@60
          echo "✅ 分辨率设置成功"

      # 4. 核心修复：模拟登录触发会话+启用共享（绕开gui域）
      - name: 启动桌面+触发用户会话
        run: |
          # 1. 强制启用屏幕共享（忽略警告，已激活即可）
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on -users $NEW_USER -privs -all -restart -agent -menu 2>/dev/null
          
          # 2. 模拟用户登录（触发gui会话创建，关键！）
          sudo -u $NEW_USER open -a loginwindow  # 以macuser身份打开登录窗口，自动登录
          sleep 20  # 等待会话生成
          
          # 3. 启动桌面核心组件（不用绑定gui域，会话已存在）
          sudo -u $NEW_USER launchctl kickstart -s gui/$(id -u $NEW_USER)/com.apple.Dock
          sudo -u $NEW_USER launchctl kickstart -s gui/$(id -u $NEW_USER)/com.apple.Finder
          sudo launchctl kickstart -s system/com.apple.WindowServer
          
          # 4. 再次确认VNC服务
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist
          sleep 20
          echo "✅ 桌面会话已触发，核心组件启动成功"

      # 5. 关闭防火墙+检查端口
      - name: 关闭防火墙+验证VNC
        run: |
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off
          lsof -i :$VNC_PORT && echo "✅ VNC端口正在监听" || (sudo launchctl restart system/com.apple.screensharing && echo "⚠️ VNC端口已重启")

      # 6. 启动frp
      - name: 启动mefrp穿透
        run: |
          FRP_PATH="$GITHUB_WORKSPACE/.github/workflows/scripts/$FRP_BIN"
          chmod +x "$FRP_PATH"
          nohup "$FRP_PATH" -t "$FRP_TOKEN" -p "$FRP_SERVER_PORT" > ~/frp.log 2>&1 &
          sleep 5
          pgrep "$FRP_BIN" && echo "✅ frp启动成功" || (cat ~/frp.log && exit 1)

      # 7. 保活（维持会话）
      - name: 保活服务
        run: |
          FRP_PATH="$GITHUB_WORKSPACE/.github/workflows/scripts/$FRP_BIN"
          USER_UID=$(id -u $NEW_USER)
          while true; do
            # 维持用户会话和桌面组件
            pgrep -u $NEW_USER loginwindow || sudo -u $NEW_USER open -a loginwindow
            pgrep -u $NEW_USER Dock || sudo -u $NEW_USER launchctl kickstart -s gui/$USER_UID/com.apple.Dock
            pgrep WindowServer || sudo launchctl kickstart -s system/com.apple.WindowServer
            pgrep "$FRP_BIN" || nohup "$FRP_PATH" -t "$FRP_TOKEN" -p "$FRP_SERVER_PORT" > ~/frp.log 2>&1 &
            echo "[$(date)] 正常运行 → 连接：你的frp服务器:$FRP_SERVER_PORT"
            sleep 120
          done
