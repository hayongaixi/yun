name: macOS 桌面体验（VNC 连接）
on:
  workflow_dispatch:

jobs:
  macos-desktop:
    runs-on: macos-latest
    timeout-minutes: 360
    env:
      VNC_PASSWORD: "Pass@Word1"  # VNC 密码

    steps:
      # 1. 安装图形化组件（兼容 macOS 的方案）
      - name: 安装桌面依赖（XQuartz+twm+VNC）
        run: |
          # 安装 XQuartz（macOS 图形基础）、twm（轻量窗口管理器，macOS 兼容）、tigervnc（VNC 服务器）
          brew install xquartz tigervnc
          # twm 通常随 XQuartz 自带，若没有则手动安装
          if ! command -v twm &> /dev/null; then
            brew install xorg-twm
          fi
          echo "✅ 图形组件安装完成"

      # 2. 配置 XQuartz（允许远程访问）
      - name: 配置 X11 图形环境
        run: |
          # 启动 XQuartz
          open -a XQuartz
          sleep 10  # 等待启动
          # 允许 TCP 连接（远程 VNC 需要）
          defaults write org.macosforge.xquartz.X11 nolisten_tcp -bool false
          # 设置默认窗口管理器为 twm（替换 fluxbox，macOS 兼容）
          defaults write org.macosforge.xquartz.X11 app_to_run -string "/opt/homebrew/bin/twm"
          # 配置显示变量
          echo "export DISPLAY=:0" >> ~/.bashrc
          source ~/.bashrc
          echo "✅ X11 环境配置完成"

      # 3. 启动 VNC 服务器
      - name: 启动 VNC 服务
        run: |
          # 设置 VNC 密码
          echo "$VNC_PASSWORD" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          # 启动 VNC（分辨率 1280x800，端口 5900）
          vncserver :0 -geometry 1280x800 -depth 24 -passwordfile ~/.vnc/passwd
          vncserver -list  # 验证启动状态
          echo "✅ VNC 服务启动成功"

      # 4. 获取公网 IP（用于连接）
      - name: 获取公网 IP
        run: |
          PUBLIC_IP=$(curl -s icanhazip.com)
          echo "PUBLIC_IP=$PUBLIC_IP" >> $GITHUB_ENV
          echo "=== 公网 IP：$PUBLIC_IP ==="

      # 5. 输出连接信息
      - name: 显示 VNC 连接参数
        run: |
          echo "======================================="
          echo "📌 VNC 连接信息"
          echo "服务器地址：$PUBLIC_IP:5900"
          echo "密码：$VNC_PASSWORD"
          echo "======================================="
          echo "💡 桌面是基础 twm 窗口管理器，右键可打开菜单"

      # 6. 保活
      - name: 保持桌面运行
        run: |
          while true; do
            echo "[$(date)] 桌面运行中... 连接地址：$PUBLIC_IP:5900"
            sleep 300
          done
