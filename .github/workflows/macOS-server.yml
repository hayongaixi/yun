name: macOS 桌面 + mefrp 穿透（黑屏根治版）
on:
  workflow_dispatch:

jobs:
  macos-black-screen-cure:
    runs-on: macos-latest
    timeout-minutes: 3600
    env:
      NEW_USER: macuser
      NEW_PASS: Mac@1234
      FRP_BIN: mefrpc_arm64
      FRP_TOKEN: bab042f57c6e615bc8692773cf2386dc
      FRP_SERVER_PORT: 125545
      VNC_PORT: 5900

    steps:
      # 1. 克隆仓库
      - name: 克隆仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 创建/复用用户
      - name: 创建/复用用户
        run: |
          if ! dscl . -read /Users/$NEW_USER &> /dev/null; then
            sudo dscl . -create /Users/$NEW_USER
            sudo dscl . -create /Users/$NEW_USER UserShell /bin/bash
            sudo dscl . -create /Users/$NEW_USER UniqueID 1001
            sudo dscl . -create /Users/$NEW_USER PrimaryGroupID 20
            sudo dscl . -create /Users/$NEW_USER NFSHomeDirectory /Users/$NEW_USER
            sudo dscl . -passwd /Users/$NEW_USER $NEW_PASS
            sudo mkdir -p /Users/$NEW_USER
            sudo chown -R $NEW_USER:staff /Users/$NEW_USER
            sudo dseditgroup -o edit -a $NEW_USER -t user admin
            echo "✅ 用户创建成功"
          else
            echo "ℹ️ 用户已存在，直接使用"
          fi

      # 3. 关键：用 cscreen 强制绑定显示（底层工具，支持无头渲染）
      - name: 安装 cscreen+强制设置显示
        run: |
          # 安装比 screenresolution 更底层的显示工具（支持无头模式）
          brew install cscreen
          # 强制创建显示设备+绑定分辨率（1024x768，强制启用渲染缓冲区）
          cscreen -x 1024 -y 768 -d 0 -f 60  # -f 强制刷新，-d 0 绑定默认显示
          echo "✅ 显示设备已强制创建，渲染缓冲区启用"

      # 4. 核心：自动登录+绑定远程会话+强制刷新
      - name: 自动登录+会话绑定+显示刷新
        run: |
          # 1. 自动登录（必须让系统生成用户会话）
          sudo defaults write /Library/Preferences/com.apple.loginwindow autoLoginUser $NEW_USER
          sudo defaults write /Library/Preferences/com.apple.loginwindow autoLoginUserScreenLocked -bool false
          
          # 2. 启动登录窗口，触发自动登录
          sudo open -a loginwindow
          sleep 40  # 延长到40秒，给足渲染时间
          
          # 3. 强制绑定屏幕共享到远程会话（关键！让VNC能获取画面）
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -configure -clientopts -setvnclegacy -vnclegacy yes
          sudo launchctl restart system/com.apple.screensharing
          
          # 4. 定期刷新显示缓冲区（避免黑屏）
          for i in {1..5}; do
            cscreen -x 1024 -y 768 -d 0 -f 60  # 每5秒刷新一次，共5次
            sleep 5
          done
          
          echo "✅ 会话绑定+显示刷新完成"

      # 5. 关闭防火墙
      - name: 关闭防火墙
        run: sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off

      # 6. 启动 frp
      - name: 启动 mefrp 穿透
        run: |
          FRP_PATH="$GITHUB_WORKSPACE/.github/workflows/scripts/$FRP_BIN"
          chmod +x "$FRP_PATH"
          nohup "$FRP_PATH" -t "$FRP_TOKEN" -p "$FRP_SERVER_PORT" > ~/frp.log 2>&1 &
          sleep 5
          pgrep "$FRP_BIN" && echo "✅ frp启动成功" || (cat ~/frp.log && exit 1)

      # 7. 保活+持续刷新显示（根治黑屏）
      - name: 保活+定期刷新显示
        run: |
          FRP_PATH="$GITHUB_WORKSPACE/.github/workflows/scripts/$FRP_BIN"
          while true; do
            # 维持核心进程
            pgrep loginwindow || sudo open -a loginwindow
            pgrep WindowServer || sudo launchctl kickstart -s system/com.apple.WindowServer
            pgrep screensharing || sudo launchctl restart system/com.apple.screensharing
            pgrep "$FRP_BIN" || nohup "$FRP_PATH" -t "$FRP_TOKEN" -p "$FRP_SERVER_PORT" > ~/frp.log 2>&1 &
            
            # 每30秒刷新一次显示缓冲区（防止黑屏）
            cscreen -x 1024 -y 768 -d 0 -f 60
            echo "[$(date)] 运行中 → 显示已刷新 | 连接：你的frp服务器:$FRP_SERVER_PORT"
            sleep 30
          done
