            - name: Telegram_Action_MAC
  # You may pin to the exact commit or the version.
  # uses: zaiyou12/telegram_action@b114fce4552978460da0e56d2ac103f18b4a67df
  uses: zaiyou12/telegram_action@v0.2
  with:
    # telegram token
    TELEGRAM_TOKEN: # default is World
    # telegram to id
    TELEGRAM_TO: # default is World
    # message
    message: # default is World
    # file path
    file: # optional, default is 
    # Mode for parsing entities in the message text. 
    PARSE_MODE: # optional, default is MarkdownV2
          
