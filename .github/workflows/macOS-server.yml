name: macOS 桌面 + mefrp 穿透（零强制无错版）
on:
  workflow_dispatch:

jobs:
  macos-ultimate-zero-force:
    runs-on: macos-latest
    timeout-minutes: 3600
    env:
      NEW_USER: macuser
      NEW_PASS: Mac@1234
      FRP_BIN: mefrpc_arm64
      FRP_TOKEN: bab042f57c6e615bc8692773cf2386dc
      FRP_SERVER_PORT: 125545
      VNC_PORT: 5900

    steps:
      # 1. 克隆仓库
      - name: 克隆仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 创建/复用用户
      - name: 创建/复用用户
        run: |
          if ! dscl . -read /Users/$NEW_USER &> /dev/null; then
            sudo dscl . -create /Users/$NEW_USER
            sudo dscl . -create /Users/$NEW_USER UserShell /bin/bash
            sudo dscl . -create /Users/$NEW_USER UniqueID 1001
            sudo dscl . -create /Users/$NEW_USER PrimaryGroupID 20
            sudo dscl . -create /Users/$NEW_USER NFSHomeDirectory /Users/$NEW_USER
            sudo dscl . -passwd /Users/$NEW_USER $NEW_PASS
            sudo mkdir -p /Users/$NEW_USER
            sudo chown -R $NEW_USER:staff /Users/$NEW_USER
            sudo dseditgroup -o edit -a $NEW_USER -t user admin
            echo "✅ 用户创建成功"
          else
            echo "ℹ️ 用户已存在，直接使用"
          fi

      # 3. 核心：零强制配置显示（系统自动加载，不主动重启）
      - name: 原生配置显示（零强制）
        run: |
          # 1. 启用显示缓冲区（不强制，让系统慢慢处理）
          sudo defaults write /Library/Preferences/com.apple.CoreDisplay enableHiDPI -bool true
          sleep 5  # 给系统写入时间
          
          # 2. 写入分辨率配置（分步骤，每步等系统响应）
          sudo defaults write /Library/Preferences/com.apple.windowserver.plist DisplayResolutionEnabled -bool true
          sleep 5
          sudo defaults write /Library/Preferences/com.apple.windowserver.plist DisplayResolutionWidth -int 1024
          sleep 5
          sudo defaults write /Library/Preferences/com.apple.windowserver.plist DisplayResolutionHeight -int 768
          sleep 5
          sudo defaults write /Library/Preferences/com.apple.windowserver.plist DisplayResolutionRefreshRate -int 60
          sleep 5
          
          # 3. 不主动重启，只等待系统自动加载配置（关键！不触发终止）
          echo "等待系统自动加载显示配置..."
          sleep 30  # 最长等待，让系统自己生效配置
          
          # 4. 验证配置是否已被系统加载
          if [ "$(sudo defaults read /Library/Preferences/com.apple.windowserver.plist DisplayResolutionWidth 2>/dev/null)" -eq 1024 ]; then
            echo "✅ 显示配置已被系统自动加载"
          else
            echo "⚠️ 配置未加载，尝试温和刷新"
            sudo launchctl kickstart -s system/com.apple.WindowServer  # 温和启动，不强制杀进程
            sleep 15
          fi

      # 4. 自动登录+VNC 终极配置（纯系统流程）
      - name: 自动登录+VNC 绑定
        run: |
          # 1. 自动登录（系统原生流程，不干预）
          sudo defaults write /Library/Preferences/com.apple.loginwindow autoLoginUser $NEW_USER
          sudo defaults write /Library/Preferences/com.apple.loginwindow autoLoginUserScreenLocked -bool false
          sleep 5
          
          # 2. 启动登录窗口，让系统自动完成登录+加载桌面
          sudo open -a loginwindow
          sleep 60  # 给足1分钟，让系统走完所有渲染流程
          
          # 3. VNC 纯原生启用（不强制重启服务）
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist
          sudo dscl . -create /Users/$NEW_USER RemoteManagementEnabled true
          sleep 10
          echo "✅ 自动登录+VNC 绑定完成"

      # 5. 关闭防火墙
      - name: 关闭防火墙
        run: sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off

      # 6. 启动 frp
      - name: 启动 mefrp 穿透
        run: |
          FRP_PATH="$GITHUB_WORKSPACE/.github/workflows/scripts/$FRP_BIN"
          chmod +x "$FRP_PATH"
          nohup "$FRP_PATH" -t "$FRP_TOKEN" -p "$FRP_SERVER_PORT" > ~/frp.log 2>&1 &
          sleep 5
          pgrep "$FRP_BIN" && echo "✅ frp启动成功" || (cat ~/frp.log && exit 1)

      # 7. 保活（纯监测，不主动干预）
      - name: 保活（零强制）
        run: |
          FRP_PATH="$GITHUB_WORKSPACE/.github/workflows/scripts/$FRP_BIN"
          while true; do
            # 只监测，不主动杀进程，系统自己维护
            if ! pgrep loginwindow; then
              echo "⚠️ 登录窗口已退出，温和启动"
              sudo open -a loginwindow
            fi
            if ! pgrep WindowServer; then
              echo "⚠️ 窗口服务器已退出，温和启动"
              sudo launchctl kickstart -s system/com.apple.WindowServer
            fi
            if ! pgrep screensharing; then
              echo "⚠️ VNC服务已退出，温和启动"
              sudo launchctl kickstart -s system/com.apple.screensharing
            fi
            if ! pgrep "$FRP_BIN"; then
              echo "⚠️ frp已退出，重启"
              nohup "$FRP_PATH" -t "$FRP_TOKEN" -p "$FRP_SERVER_PORT" > ~/frp.log 2>&1 &
            fi
            
            echo "[$(date)] 运行中 → 连接：你的frp服务器:$FRP_SERVER_PORT"
            sleep 120
          done
