name: macOS 桌面 + mefrp 穿透（VNC 稳定版）
on:
  workflow_dispatch:

jobs:
  macos-vnc-stable:
    runs-on: macos-latest
    timeout-minutes: 3600
    env:
      NEW_USER: macuser
      NEW_PASS: Mac@1234
      FRP_BIN: mefrpc_arm64
      FRP_TOKEN: bab042f57c6e615bc8692773cf2386dc
      FRP_SERVER_PORT: 125545
      VNC_PORT: 5900

    steps:
      # 1. 克隆仓库
      - name: 克隆仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 创建/复用用户
      - name: 创建/复用用户
        run: |
          if ! dscl . -read /Users/$NEW_USER &> /dev/null; then
            sudo dscl . -create /Users/$NEW_USER
            sudo dscl . -create /Users/$NEW_USER UserShell /bin/bash
            sudo dscl . -create /Users/$NEW_USER UniqueID 1001
            sudo dscl . -create /Users/$NEW_USER PrimaryGroupID 20
            sudo dscl . -create /Users/$NEW_USER NFSHomeDirectory /Users/$NEW_USER
            sudo dscl . -passwd /Users/$NEW_USER $NEW_PASS
            sudo mkdir -p /Users/$NEW_USER
            sudo chown -R $NEW_USER:staff /Users/$NEW_USER
            sudo dseditgroup -o edit -a $NEW_USER -t user admin
            echo "✅ 用户创建成功"
          else
            echo "ℹ️ 用户已存在，直接使用"
          fi

      # 3. 显示配置（零强制，确保渲染）
      - name: 原生显示配置
        run: |
          sudo defaults write /Library/Preferences/com.apple.CoreDisplay enableHiDPI -bool true
          sleep 5
          sudo defaults write /Library/Preferences/com.apple.windowserver.plist DisplayResolutionEnabled -bool true
          sudo defaults write /Library/Preferences/com.apple.windowserver.plist DisplayResolutionWidth -int 1024
          sudo defaults write /Library/Preferences/com.apple.windowserver.plist DisplayResolutionHeight -int 768
          sudo defaults write /Library/Preferences/com.apple.windowserver.plist DisplayResolutionRefreshRate -int 60
          sleep 30
          echo "✅ 显示配置完成"

      # 4. 核心：VNC 服务强制稳定启用（锁定自启+权限）
      - name: 强制稳定启用 VNC
        run: |
          # 1. 自动登录（生成会话基础）
          sudo defaults write /Library/Preferences/com.apple.loginwindow autoLoginUser $NEW_USER
          sudo defaults write /Library/Preferences/com.apple.loginwindow autoLoginUserScreenLocked -bool false
          sudo open -a loginwindow
          sleep 60

          # 2. 强制启用 VNC 并锁定自启（关键！防止被系统禁用）
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist  # -w 强制设为自启
          sudo defaults write /Library/Preferences/com.apple.screensharing.plist Disabled -bool false
          sudo dscl . -create /Users/$NEW_USER RemoteManagementEnabled true
          sudo dscl . -create /Users/$NEW_USER RemoteAccessEnabled true

          # 3. 强制重启 VNC 服务（确保加载配置）
          sudo launchctl kickstart -k system/com.apple.screensharing
          sleep 15

          # 4. 验证 VNC 端口是否真的在监听（核心验证）
          if lsof -i :$VNC_PORT; then
            echo "✅ VNC 服务稳定运行，端口 $VNC_PORT 已监听"
          else
            echo "❌ VNC 端口未监听，重试启用"
            sudo launchctl unload /System/Library/LaunchDaemons/com.apple.screensharing.plist
            sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist
            sleep 10
            lsof -i :$VNC_PORT && echo "✅ 重试成功" || exit 1
          fi

      # 5. 关闭防火墙+禁用节能（避免服务休眠）
      - name: 关闭防火墙+禁用节能
        run: |
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off
          # 禁用节能，防止系统休眠导致 VNC 退出
          sudo pmset -a displaysleep 0
          sudo pmset -a sleep 0
          echo "✅ 防火墙关闭，节能禁用"

      # 6. 启动 frp（确认穿透正常）
      - name: 启动 mefrp 穿透
        run: |
          FRP_PATH="$GITHUB_WORKSPACE/.github/workflows/scripts/$FRP_BIN"
          chmod +x "$FRP_PATH"
          nohup "$FRP_PATH" -t "$FRP_TOKEN" -p "$FRP_SERVER_PORT" > ~/frp.log 2>&1 &
          sleep 5
          pgrep "$FRP_BIN" && echo "✅ frp启动成功（PID: $(pgrep $FRP_BIN)）" || (cat ~/frp.log && exit 1)

      # 7. 保活：强化 VNC 稳定性（端口监听检查）
      - name: 保活（VNC 端口监测）
        run: |
          FRP_PATH="$GITHUB_WORKSPACE/.github/workflows/scripts/$FRP_BIN"
          while true; do
            # 监测核心进程
            pgrep loginwindow || sudo open -a loginwindow
            pgrep WindowServer || sudo launchctl kickstart -s system/com.apple.WindowServer
            pgrep "$FRP_BIN" || nohup "$FRP_PATH" -t "$FRP_TOKEN" -p "$FRP_SERVER_PORT" > ~/frp.log 2>&1 &

            # 关键：监测 VNC 端口，没监听就强制重启服务
            if ! lsof -i :$VNC_PORT; then
              echo "⚠️ VNC 端口未监听，强制重启服务"
              sudo launchctl kickstart -k system/com.apple.screensharing
              sleep 5
            fi

            echo "[$(date)] 运行中 → VNC端口：$VNC_PORT（监听中） | 穿透：你的frp服务器:$FRP_SERVER_PORT"
            sleep 60  # 缩短间隔，及时发现端口问题
          done
