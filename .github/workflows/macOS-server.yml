name: macOS 原生桌面（完美运行版）
on:
  workflow_dispatch:

jobs:
  macos-native-desktop:
    runs-on: macos-latest
    timeout-minutes: 360  # 6小时超时，足够体验
    env:
      NEW_USER: macuser
      NEW_PASS: Mac@1234
      UNIQUE_ID: 1001
      GROUP_ID: 20
      USER_DIR: /Users/$NEW_USER

    steps:
      # 1. 彻底清理旧用户残留
      - name: 清理旧用户
        run: |
          if dscl . -read /Users/$NEW_USER &> /dev/null; then
            sudo dscl . -delete /Users/$NEW_USER
            echo "已删除旧用户记录"
          fi
          if [ -d "$USER_DIR" ]; then
            sudo rm -rf "$USER_DIR"
            echo "已删除旧用户目录"
          fi

      # 2. 正确创建新用户（系统必识别）
      - name: 创建新用户
        run: |
          sudo dscl . -create /Users/$NEW_USER
          sudo dscl . -create /Users/$NEW_USER UserShell /bin/bash
          sudo dscl . -create /Users/$NEW_USER RealName "macOS Test User"
          sudo dscl . -create /Users/$NEW_USER UniqueID $UNIQUE_ID
          sudo dscl . -create /Users/$NEW_USER PrimaryGroupID $GROUP_ID
          sudo dscl . -create /Users/$NEW_USER NFSHomeDirectory $USER_DIR
          sudo dscl . -passwd /Users/$NEW_USER $NEW_PASS
          sudo mkdir -p $USER_DIR
          sudo chown -R $NEW_USER:staff $USER_DIR
          sudo dseditgroup -o edit -a $NEW_USER -t user admin
          echo "✅ 新用户创建成功：$NEW_USER"

      # 3. 启用屏幕共享
      - name: 启用远程管理
        run: |
          sudo systemsetup -setremotelogin on
          sudo systemsetup -setcomputersleep Off
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist
          sudo dscl . -create /Users/$NEW_USER RemoteManagementEnabled true
          echo "✅ 屏幕共享已启用"

      # 4. 启动原生桌面
      - name: 启动Aqua桌面
        run: |
          sudo launchctl start com.apple.WindowServer
          sudo -u $NEW_USER open -a loginwindow
          sleep 25
          if pgrep WindowServer; then
            echo "✅ 桌面启动成功"
          else
            sudo launchctl restart com.apple.WindowServer
          fi

      # 5. 关闭防火墙
      - name: 关闭防火墙
        run: |
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off
          echo "✅ 防火墙已关闭"

      # 6. 获取公网IP（关键：确保变量正确传递）
      - name: 获取公网IP并保存
        id: get_ip  # 用id标记，方便后续引用
        run: |
          PUBLIC_IP=$(curl -s icanhazip.com)
          echo "PUBLIC_IP=$PUBLIC_IP" >> $GITHUB_ENV  # 写入环境变量
          echo "公网IP：$PUBLIC_IP"  # 显示IP，方便手动记录

      # 7. 显示连接信息（提前展示，避免保活步骤变量问题）
      - name: 连接信息（必记！）
        run: |
          echo "======================================="
          echo "🎉 macOS 原生桌面已准备好！"
          echo "VNC地址：$PUBLIC_IP:5900"  # 这里先显示，确保用户能看到
          echo "用户名：$NEW_USER"
          echo "密码：$NEW_PASS"
          echo "======================================="

      # 8. 保活（简化循环，直接用获取到的IP）
      - name: 保持桌面运行
        run: |
          # 直接用环境变量中的IP，避免嵌套循环
          while true; do
            sudo launchctl kickstart -k system/com.apple.WindowServer
            echo "[$(date)] 桌面运行中... 连接地址：$PUBLIC_IP:5900"
            sleep 300
          done
